<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfólio de Stheffany Santos, desenvolvedora de software. Flutter, React, Java, projetos e artigos.">

  <!-- Preview de link (LinkedIn, WhatsApp, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Stheffany Santos | Desenvolvedora de Software">
  <meta property="og:description" content="Portfólio de Stheffany Santos, desenvolvedora de software. Flutter, React, Java, projetos e artigos.">
  <meta property="og:image" content="https://www.tets.app.br/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#042B59">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stheffany Santos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stheffany Santos | Desenvolvedora de Software</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: #E8F3FB;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .4s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 140px; height: 140px; object-fit: contain; animation: float 2s ease-in-out infinite; }
    #splash b { color: #042B59; font-size: 22px; letter-spacing: -.02em; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #D3DEEA; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #0175C2; border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <b>Stheffany Santos</b>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 500);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
